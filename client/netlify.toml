[build]
  command = "npm install && npm run build"
  publish = "dist"

# Backend on Render. Baked in at build time so both REST calls and the
# home-page WebSocket go straight to Render - Netlify redirects cannot
# proxy WebSocket upgrades, so the /ws/* path must not be relative.
[build.environment]
  VITE_API_URL = "https://e-store-demo-api.onrender.com"
  # Agent home page is off: it needs ~600MB and the backend runs on a 512MB
  # instance. Set to "true" together with ENABLE_AGENT_HOME on a >=2GB backend.
  VITE_ENABLE_AGENT_HOME = "false"

# Fallback for any relative /api call that slips through
[[redirects]]
  from = "/api/*"
  to = "https://e-store-demo-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA redirect - all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
